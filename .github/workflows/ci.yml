name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Detector cases (synthetic traces + fixtures, no Docker)
        run: PYTHONPATH=scoring python tests/detectors/run.py

      - name: pytest
        run: python -m pytest -q

      - name: Frozen files unchanged (sha256 of content)
        run: python -m extprobe verify-freeze

      - name: Paper numbers from the precomputed result files
        run: python evaluation/v2/check_paper_numbers.py --precomputed
        # the two trace-dependent checks need the recorded traces (release asset) and are skipped here
